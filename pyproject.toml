[project]
name = "gmail-mcp"
version = "0.1.0"
description = "Gmail MCP Server for sending emails via Gmail API"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.13.3",
    "google-auth>=2.48.0",
    "google-api-python-client>=2.187.0",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.12.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
